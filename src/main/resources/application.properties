spring.application.name=GreenMart-Backend

#Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/greenmartdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:D6_86856_Yash}
spring.datasource.password=${DB_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#jwt
jwt.secret=${JWT_SECRET:}

# Actuator Configuration (Spring Boot Engineer)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Database Connection Pooling (Database Administrator)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000